name: xFinder
options:
  bundleIdPrefix: dev.skylan
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"
packages:
  xFinderKit:
    path: .
targets:
  xFinder:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: xFinderKit
        product: xFinderKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: xFinder
        CFBundleDisplayName: xFinder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Copyright © 2026 Tian Lan
        NSAppleEventsUsageDescription: xFinder uses Apple Events to open SSH sessions in iTerm2.
        NSPrincipalClass: NSApplication
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.skylan.xfinder.remote-items
            UTTypeDescription: xFinder remote items
            UTTypeConformsTo: [public.data]
    entitlements:
      path: App/xFinder.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.skylan.xFinder
        PRODUCT_NAME: xFinder
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CODE_SIGN_FLAGS: "--options=runtime --timestamp=none"
        # Hardened Runtime + ad-hoc signing rejects the separately signed debug dylib.
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
